name: Verify and deploy MORAI AROMA to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morai-vps-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dyknsp.github.io/Morai' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 11.25.0
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check content data
        run: pnpm test
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Build production app
        run: pnpm build

  deploy:
    if: ${{ vars.VPS_HOST != '' && vars.VPS_USER != '' && vars.VPS_APP_PATH != '' && vars.NEXT_PUBLIC_SITE_URL != '' }}
    runs-on: ubuntu-latest
    needs: verify
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_APP_PATH: ${{ vars.VPS_APP_PATH }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add IndexNow verification file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ -z "$INDEXNOW_KEY" ]]; then exit 0; fi
          if [[ ! "$INDEXNOW_KEY" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "INDEXNOW_KEY must be a 32-character hexadecimal key." >&2
            exit 1
          fi
          printf '%s' "$INDEXNOW_KEY" > "public/${INDEXNOW_KEY}.txt"
      - name: Set up SSH and validate deployment settings
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST must be a DNS name or IPv4 address." >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "VPS_USER contains unsupported characters." >&2; exit 1; }
          [[ "$VPS_APP_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]] || { echo "VPS_APP_PATH must be an absolute path using letters, digits, /, _ or -." >&2; exit 1; }
          [[ "$VPS_SSH_KEY" == *"PRIVATE KEY"* ]] || { echo "Add the VPS_SSH_KEY repository secret." >&2; exit 1; }
          [[ -n "$VPS_KNOWN_HOSTS" ]] || { echo "Add the VPS_KNOWN_HOSTS repository secret." >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Copy application files to VPS
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.pnpm-store/' \
            --exclude='data/' \
            --exclude='.env' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/"
      - name: Build and restart app on VPS
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_PATH' && docker compose -f deploy/docker-compose.yml up -d --build --remove-orphans"
      - name: Check live site
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$NEXT_PUBLIC_SITE_URL/" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "VPS site health check failed." >&2
          exit 1
      - name: Set up Node.js for IndexNow
        if: ${{ success() && env.INDEXNOW_KEY != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Notify IndexNow
        if: ${{ success() && env.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DEPLOY_BASE: ${{ github.event.before }}
          DEPLOY_HEAD: ${{ github.sha }}
        run: node scripts/indexnow.mjs
