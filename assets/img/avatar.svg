    <circle cx="100" cy="78" r="34" fill="url(#a-fig)"/>
    <path d="M100 122 C58 122 30 152 24 200 L176 200 C170 152 142 122 100 122 Z" fill="url(#a-fig)"/>
    <circle cx="100" cy="100" r="99" fill="none" stroke="#c9a44c" stroke-width="1.5" stroke-opacity=".5"/>
  </g>
</svg>
