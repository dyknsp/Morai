<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Аватар клиента">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243026"/>
      <stop offset=".55" stop-color="#161f18"/>
      <stop offset="1" stop-color="#0a0f0b"/>
    </linearGradient>
    <linearGradient id="a-fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c179" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8a6a24" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="a-glow" cx=".5" cy=".35" r=".6">
      <stop offset="0" stop-color="#f0d79a" stop-opacity=".3"/>
