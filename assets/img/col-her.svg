<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Коллекция для неё — тёмный фон с розой и тёплым светом">
  <defs>
    <linearGradient id="c1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a12"/>
      <stop offset=".5" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#070a07"/>
    </linearGradient>
    <radialGradient id="c1-bloom" cx=".62" cy=".42" r=".55">
      <stop offset="0" stop-color="#f0c98a" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#a3673a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8bb8a" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#a4633c" stop-opacity=".75"/>
      <stop offset="1" stop-color="#4a2a1a" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="c1-petal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9ae" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8a4f2c" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="c1-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".35" stop-color="#040704" stop-opacity="0"/>
      <stop offset="1" stop-color="#040704" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="c1-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".7"/>
    </radialGradient>
    <filter id="c1-b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="c1-b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="c1-b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#c1-bg)"/>
  <g filter="url(#c1-b30)" opacity=".55">
    <ellipse cx="120" cy="880" rx="300" ry="200" fill="#101c12"/>
    <ellipse cx="700" cy="180" rx="260" ry="180" fill="#1c1410"/>
  </g>
  <rect width="800" height="1000" fill="url(#c1-bloom)"/>

  <!-- лепестки -->
  <g transform="translate(400 470)" filter="url(#c1-b2)">
    <g opacity=".55">
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(0)"/>
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(51.4)"/>
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(102.8)"/>
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(154.2)"/>
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(205.6)"/>
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(257)"/>
      <path d="M0 0 C-150 -60 -190 -190 -120 -280 C-30 -230 20 -120 0 0 Z" fill="url(#c1-petal)" transform="rotate(308.4)"/>
    </g>
    <g opacity=".9">
      <path d="M0 0 C-95 -40 -120 -130 -70 -190 C-10 -150 20 -70 0 0 Z" fill="url(#c1-petal2)" transform="rotate(25)"/>
      <path d="M0 0 C-95 -40 -120 -130 -70 -190 C-10 -150 20 -70 0 0 Z" fill="url(#c1-petal2)" transform="rotate(97)"/>
      <path d="M0 0 C-95 -40 -120 -130 -70 -190 C-10 -150 20 -70 0 0 Z" fill="url(#c1-petal2)" transform="rotate(169)"/>
      <path d="M0 0 C-95 -40 -120 -130 -70 -190 C-10 -150 20 -70 0 0 Z" fill="url(#c1-petal2)" transform="rotate(241)"/>
      <path d="M0 0 C-95 -40 -120 -130 -70 -190 C-10 -150 20 -70 0 0 Z" fill="url(#c1-petal2)" transform="rotate(313)"/>
    </g>
    <g opacity=".95">
      <path d="M0 0 C-52 -26 -66 -80 -36 -112 C-4 -84 14 -38 0 0 Z" fill="#f7e0bb" opacity=".85" transform="rotate(40)"/>
      <path d="M0 0 C-52 -26 -66 -80 -36 -112 C-4 -84 14 -38 0 0 Z" fill="#f7e0bb" opacity=".85" transform="rotate(160)"/>
      <path d="M0 0 C-52 -26 -66 -80 -36 -112 C-4 -84 14 -38 0 0 Z" fill="#f7e0bb" opacity=".85" transform="rotate(280)"/>
    </g>
    <circle r="26" fill="#5c3320"/>
    <circle r="16" fill="#e9c07f" opacity=".9" filter="url(#c1-b8)"/>
  </g>

  <!-- стебель и листья -->
  <g stroke="#1f2c1c" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M400 500 C420 650 380 780 400 960"/>
    <path d="M400 640 C300 620 250 560 230 500"/>
    <path d="M400 720 C500 700 560 650 580 600"/>
  </g>
  <g fill="#16231a" opacity=".95">
    <path d="M400 640 C320 620 270 570 250 505 C330 520 385 570 400 640 Z"/>
    <path d="M400 720 C480 700 540 655 560 600 C480 615 420 660 400 720 Z"/>
  </g>

  <rect width="800" height="1000" fill="url(#c1-fade)"/>
  <rect width="800" height="1000" fill="url(#c1-vig)"/>
</svg>
