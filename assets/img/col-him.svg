<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Коллекция для него — тёмный фон с гранёным кристаллом">
  <defs>
    <linearGradient id="c2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1414"/>
      <stop offset=".45" stop-color="#101a19"/>
      <stop offset="1" stop-color="#050808"/>
    </linearGradient>
    <radialGradient id="c2-bloom" cx=".4" cy=".38" r=".55">
      <stop offset="0" stop-color="#cfe0d8" stop-opacity=".3"/>
      <stop offset=".4" stop-color="#4d7a6a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c2-f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f1" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8fb3a6" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="c2-f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb3a6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2c4a41" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="c2-f3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7a6a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#101f1c" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="c2-f4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c48a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7d6532" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="c2-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".35" stop-color="#040706" stop-opacity="0"/>
      <stop offset="1" stop-color="#040706" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="c2-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".72"/>
    </radialGradient>
    <filter id="c2-b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="c2-b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#c2-bg)"/>
  <g filter="url(#c2-b30)" opacity=".5">
    <ellipse cx="640" cy="820" rx="320" ry="220" fill="#12211d"/>
    <ellipse cx="160" cy="200" rx="260" ry="180" fill="#16241f"/>
  </g>
  <rect width="800" height="1000" fill="url(#c2-bloom)"/>

  <!-- вертикальные световые полосы -->
  <g filter="url(#c2-b10)" opacity=".22">
    <rect x="150" y="0" width="20" height="1000" fill="#cfe0d8"/>
    <rect x="600" y="0" width="12" height="1000" fill="#cfe0d8"/>
  </g>

  <!-- гранёный кристалл -->
  <g transform="translate(400 470)">
    <circle r="230" fill="#9fd0bd" opacity=".1" filter="url(#c2-b30)"/>
    <path d="M0 -250 L150 -80 L0 240 L-150 -80 Z" fill="url(#c2-f3)" stroke="#cfe0d8" stroke-width="1.6" stroke-opacity=".45"/>
    <path d="M0 -250 L150 -80 L0 20 Z" fill="url(#c2-f1)" opacity=".9"/>
    <path d="M0 -250 L-150 -80 L0 20 Z" fill="url(#c2-f2)"/>
    <path d="M0 240 L150 -80 L0 20 Z" fill="#16241f" opacity=".9"/>
    <path d="M0 240 L-150 -80 L0 20 Z" fill="#0d1a17" opacity=".92"/>
    <path d="M0 -250 L0 240" stroke="#eef6f1" stroke-width="1" stroke-opacity=".3"/>
    <path d="M-150 -80 L150 -80" stroke="#eef6f1" stroke-width="1" stroke-opacity=".22"/>
    <path d="M-16 -238 L-70 -96 L-8 -16" stroke="#ffffff" stroke-width="4" stroke-opacity=".35" fill="none"/>
    <circle r="10" cy="-140" cx="-40" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- золотые частицы -->
  <g fill="#e0c179">
    <circle cx="215" cy="300" r="3.5" opacity=".55"/>
    <circle cx="590" cy="250" r="2.6" opacity=".45"/>
    <circle cx="640" cy="560" r="3" opacity=".4"/>
    <circle cx="170" cy="620" r="2.4" opacity=".5"/>
    <circle cx="540" cy="820" r="3.2" opacity=".35"/>
    <circle cx="300" cy="180" r="2.2" opacity=".4"/>
  </g>

  <!-- нижняя граница-подставка -->
  <ellipse cx="400" cy="740" rx="180" ry="26" fill="#000000" opacity=".45" filter="url(#c2-b10)"/>
  <rect y="742" width="800" height="6" fill="url(#c2-f4)" opacity=".35"/>

  <rect width="800" height="1000" fill="url(#c2-fade)"/>
  <rect width="800" height="1000" fill="url(#c2-vig)"/>
</svg>
