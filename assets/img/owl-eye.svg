    </g>
    <circle r="118" fill="none" stroke="#f7dc9a" stroke-width="3" opacity=".22"/>
    <circle r="150" fill="none" stroke="#1a1002" stroke-width="4" opacity=".3"/>
    <!-- зрачок -->
    <ellipse rx="46" ry="62" fill="#080502"/>
    <ellipse rx="46" ry="62" fill="none" stroke="#000000" stroke-width="3" opacity=".6"/>
    <ellipse cx="-14" cy="-22" rx="16" ry="20" fill="#f7e3ae" opacity=".35" filter="url(#o-b2)"/>
    <!-- блик -->
    <ellipse cx="-52" cy="-72" rx="30" ry="20" fill="#fff8e2" opacity=".5" filter="url(#o-b2)" transform="rotate(-25 -52 -72)"/>
    <circle r="200" fill="none" stroke="#6b4c16" stroke-width="8" opacity=".35"/>
  </g>

  <rect width="1600" height="700" fill="url(#o-vig)"/>
