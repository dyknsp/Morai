    <circle r="230" fill="#120c04" opacity=".9"/>
    <circle r="200" fill="url(#o-sclera)"/>
    <circle r="168" fill="url(#o-eye)"/>
    <!-- радиальные волокна радужки -->
    <g stroke="#f0c46a" stroke-width="2" fill="none" opacity=".38">
      <g id="o-fibers">
        <path d="M0 -60 L0 -164"/>
        <path d="M0 -60 L42 -158"/>
        <path d="M0 -60 L80 -143"/>
        <path d="M0 -60 L112 -120"/>
        <path d="M0 -60 L138 -88"/>
        <path d="M0 -60 L156 -48"/>
        <path d="M0 -60 L162 0"/>
        <path d="M0 -60 L156 48"/>
        <path d="M0 -60 L138 88"/>
        <path d="M0 -60 L112 120"/>
        <path d="M0 -60 L80 143"/>
        <path d="M0 -60 L42 158"/>
        <path d="M0 -60 L0 164"/>
        <path d="M0 -60 L-42 158"/>
        <path d="M0 -60 L-80 143"/>
        <path d="M0 -60 L-112 120"/>
        <path d="M0 -60 L-138 88"/>
        <path d="M0 -60 L-156 48"/>
        <path d="M0 -60 L-162 0"/>
        <path d="M0 -60 L-156 -48"/>
        <path d="M0 -60 L-138 -88"/>
        <path d="M0 -60 L-112 -120"/>
        <path d="M0 -60 L-80 -143"/>
        <path d="M0 -60 L-42 -158"/>
