<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Крупный план глаза совы — янтарная радужка">
  <defs>
    <radialGradient id="o-eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3a2405"/>
      <stop offset=".22" stop-color="#1a1002"/>
      <stop offset=".34" stop-color="#e0a52c"/>
      <stop offset=".55" stop-color="#b3761a"/>
      <stop offset=".78" stop-color="#6b4408"/>
      <stop offset="1" stop-color="#2a1a04"/>
    </radialGradient>
    <radialGradient id="o-sclera" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4a3218" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0a0703"/>
    </radialGradient>
    <linearGradient id="o-feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3020"/>
      <stop offset=".5" stop-color="#1c160c"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="o-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0d09" stop-opacity=".97"/>
      <stop offset=".55" stop-color="#0a0d09" stop-opacity=".82"/>
      <stop offset="1" stop-color="#0a0d09" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="o-vig" cx=".5" cy=".5" r=".7">
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".85"/>
    </radialGradient>
    <filter id="o-b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="o-b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect width="1600" height="700" fill="url(#o-feather)"/>

  <!-- оперение -->
  <g opacity=".55" stroke="#5a4a2c" stroke-width="1.5" fill="none">
    <g id="o-feathers">
      <path d="M1180 120 C1120 200 1090 300 1090 380"/>
      <path d="M1230 100 C1170 190 1140 300 1140 390"/>
      <path d="M1280 90 C1220 180 1190 300 1190 400"/>
      <path d="M1330 85 C1270 180 1240 300 1240 405"/>
      <path d="M1380 90 C1320 185 1290 305 1290 410"/>
      <path d="M1430 100 C1370 195 1340 310 1340 415"/>
      <path d="M1480 120 C1420 210 1390 320 1390 420"/>
      <path d="M1180 640 C1120 570 1095 480 1095 410"/>
      <path d="M1240 660 C1180 580 1150 480 1150 405"/>
      <path d="M1300 670 C1240 590 1210 490 1210 410"/>
      <path d="M1360 672 C1300 595 1270 495 1270 415"/>
      <path d="M1420 665 C1360 590 1330 495 1330 420"/>
      <path d="M1480 645 C1420 570 1390 480 1390 420"/>
    </g>
  </g>
  <g opacity=".3" stroke="#7a6234" stroke-width="1" fill="none">
    <path d="M1120 200 C1080 280 1065 350 1065 400"/>
    <path d="M1540 200 C1570 280 1580 350 1580 400"/>
    <path d="M1120 560 C1080 490 1065 430 1065 400"/>
    <path d="M1540 560 C1570 490 1580 430 1580 400"/>
