<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Флакон Baccarat Rouge 540 — рубиновое стекло с золотой крышкой">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f0e"/>
      <stop offset=".55" stop-color="#120a09"/>
      <stop offset="1" stop-color="#070404"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx=".5" cy=".52" r=".45">
      <stop offset="0" stop-color="#e0552f" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#8a2a18" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c4" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#c22a1c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3d0a06" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="p1-juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8442a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7a1208" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="p1-cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeec4"/>
      <stop offset=".5" stop-color="#c9a44c"/>
      <stop offset="1" stop-color="#7d5f1f"/>
    </linearGradient>
    <radialGradient id="p1-vig" cx=".5" cy=".5" r=".72">
      <stop offset=".5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".75"/>
    </radialGradient>
    <filter id="p1-b16" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="p1-b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="800" height="640" fill="url(#p1-bg)"/>
  <rect width="800" height="640" fill="url(#p1-glow)"/>
  <ellipse cx="400" cy="546" rx="210" ry="26" fill="#000000" opacity=".55" filter="url(#p1-b16)"/>

  <g>
    <circle cx="400" cy="330" r="170" fill="#e0552f" opacity=".14" filter="url(#p1-b16)"/>
    <rect x="300" y="300" width="200" height="238" rx="16" fill="url(#p1-glass)" stroke="#f0a07a" stroke-width="1.5" stroke-opacity=".5"/>
    <rect x="312" y="344" width="176" height="182" rx="10" fill="url(#p1-juice)"/>
    <rect x="352" y="252" width="96" height="52" fill="#a84a2a" opacity=".45"/>
    <rect x="344" y="206" width="112" height="52" rx="8" fill="url(#p1-cap)"/>
    <rect x="344" y="206" width="112" height="52" rx="8" fill="none" stroke="#7d5f1f" stroke-width="1.1"/>
    <rect x="360" y="218" width="9" height="30" rx="4" fill="#fff6da" opacity=".5"/>
    <rect x="314" y="314" width="13" height="212" rx="6" fill="#ffe6d2" opacity=".3"/>
    <rect x="474" y="330" width="8" height="180" rx="4" fill="#ffffff" opacity=".12"/>
    <rect x="330" y="440" width="140" height="56" rx="4" fill="#1a0604" opacity=".6"/>
    <text x="400" y="464" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill="#f2dcae" text-anchor="middle">MORAI</text>
    <text x="400" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#c9a44c" text-anchor="middle">AROMA</text>
  </g>

  <rect y="556" width="800" height="84" fill="#070404" opacity=".7"/>
  <rect width="800" height="640" fill="url(#p1-vig)"/>
</svg>
