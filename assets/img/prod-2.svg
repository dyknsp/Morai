<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Флакон Dior Sauvage — глубокое синее стекло">
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#080d17"/>
      <stop offset="1" stop-color="#030509"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx=".5" cy=".5" r=".45">
      <stop offset="0" stop-color="#3f6fd8" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#1b2f6a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p2-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce8ff" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#2a4fa8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#05080f" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="p2-juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5bc4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0a1330" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="p2-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset=".4" stop-color="#14181d"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="p2-vig" cx=".5" cy=".5" r=".72">
      <stop offset=".5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".78"/>
    </radialGradient>
    <filter id="p2-b16" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="p2-b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="800" height="640" fill="url(#p2-bg)"/>
  <rect width="800" height="640" fill="url(#p2-glow)"/>
  <ellipse cx="400" cy="552" rx="190" ry="24" fill="#000000" opacity=".55" filter="url(#p2-b16)"/>

  <g>
    <circle cx="400" cy="330" r="165" fill="#3f6fd8" opacity=".12" filter="url(#p2-b16)"/>
    <path d="M326 262 L474 262 L474 540 Q474 552 462 552 L338 552 Q326 552 326 540 Z" fill="url(#p2-glass)" stroke="#7fa2f0" stroke-width="1.4" stroke-opacity=".45"/>
    <path d="M338 320 L462 320 L462 540 Q462 548 454 548 L346 548 Q338 548 338 540 Z" fill="url(#p2-juice)"/>
    <rect x="366" y="214" width="68" height="52" fill="#1b2f6a" opacity=".6"/>
    <rect x="358" y="164" width="84" height="54" rx="6" fill="url(#p2-cap)"/>
    <rect x="372" y="176" width="8" height="30" rx="3" fill="#aab6c4" opacity=".35"/>
    <rect x="340" y="278" width="12" height="248" rx="5" fill="#eaf1ff" opacity=".28"/>
    <rect x="456" y="296" width="7" height="220" rx="3" fill="#ffffff" opacity=".1"/>
    <rect x="352" y="404" width="96" height="52" rx="3" fill="#04070d" opacity=".55"/>
    <text x="400" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="2.5" fill="#e6d6a8" text-anchor="middle">MORAI</text>
    <text x="400" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="4" fill="#c9a44c" text-anchor="middle">AROMA</text>
    <path d="M326 262 L474 262" stroke="#bcd0ff" stroke-width="1" stroke-opacity=".35"/>
  </g>

  <rect y="560" width="800" height="80" fill="#030509" opacity=".7"/>
  <rect width="800" height="640" fill="url(#p2-vig)"/>
